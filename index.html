<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>CONECTA CLIENTES PRO</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<link rel="stylesheet"
href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

:root{
    --bg:#020617;
    --card:#0f172a;
    --card2:#1e293b;
    --green:#22c55e;
    --blue:#3b82f6;
    --red:#ef4444;
    --text:#f8fafc;
    --border:#334155;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:linear-gradient(135deg,#020617,#0f172a);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
    overflow:hidden;
}

header{
    height:70px;
    background:rgba(2,6,23,.9);
    backdrop-filter:blur(10px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    border-bottom:1px solid var(--border);
}

header h1{
    font-size:24px;
}

header span{
    color:var(--green);
}

.main{
    display:flex;
    height:calc(100vh - 70px);
}

.sidebar{
    width:380px;
    background:rgba(15,23,42,.95);
    border-right:1px solid var(--border);
    overflow-y:auto;
    padding:20px;
}

.sidebar::-webkit-scrollbar{
    width:8px;
}

.sidebar::-webkit-scrollbar-thumb{
    background:#334155;
    border-radius:10px;
}

.card{
    background:var(--card2);
    padding:15px;
    border-radius:14px;
    margin-bottom:15px;
    border:1px solid #334155;
    transition:.3s;
}

.card:hover{
    transform:translateY(-2px);
    box-shadow:0 0 20px rgba(0,0,0,.3);
}

.title{
    margin-bottom:12px;
    font-size:18px;
    font-weight:bold;
}

input{
    width:100%;
    margin-bottom:10px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#0f172a;
    color:white;
    border:1px solid #334155;
    outline:none;
}

input:focus{
    border-color:var(--green);
}

button{
    border:none;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    color:white;
    font-weight:bold;
    transition:.3s;
}

button:hover{
    transform:scale(1.02);
}

.btn-green{
    background:var(--green);
}

.btn-blue{
    background:var(--blue);
}

.btn-red{
    background:var(--red);
}

.btn-full{
    width:100%;
    margin-top:8px;
}

.cliente{
    background:#0f172a;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
    border:1px solid #334155;
}

.cliente h3{
    margin-bottom:5px;
}

.cliente p{
    color:#cbd5e1;
    margin-bottom:10px;
}

.actions{
    display:flex;
    gap:8px;
}

.actions button{
    flex:1;
}

#map{
    flex:1;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:15px;
}

.stat{
    background:#0f172a;
    padding:15px;
    border-radius:12px;
    text-align:center;
    border:1px solid #334155;
}

.stat h2{
    color:var(--green);
}

.search{
    margin-bottom:15px;
}

.toast{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#22c55e;
    color:white;
    padding:15px 20px;
    border-radius:12px;
    opacity:0;
    transform:translateY(30px);
    transition:.4s;
    z-index:9999;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

@media(max-width:900px){

    .main{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        height:50%;
    }

    #map{
        height:50%;
    }
}

</style>
</head>

<body>

<header>
    <h1><i class="fa-solid fa-satellite-dish"></i> CONECTA <span>CLIENTES PRO</span></h1>

    <div id="hora"></div>
</header>

<div class="main">

    <div class="sidebar">

        <div class="stats">

            <div class="stat">
                <small>Total Clientes</small>
                <h2 id="totalClientes">0</h2>
            </div>

            <div class="stat">
                <small>Status GPS</small>
                <h2 id="gpsStatus">OFF</h2>
            </div>

        </div>

        <div class="card">

            <div class="title">
                <i class="fa-solid fa-user-plus"></i>
                Adicionar Cliente
            </div>

            <input id="nome" placeholder="Nome do cliente">

            <input id="ref" placeholder="Referência">

            <input id="lat" placeholder="Latitude">

            <input id="lon" placeholder="Longitude">

            <button class="btn-green btn-full"
            onclick="adicionarCliente()">

                <i class="fa-solid fa-plus"></i>
                Adicionar Cliente

            </button>

            <button class="btn-blue btn-full"
            onclick="minhaLocalizacao()">

                <i class="fa-solid fa-location-crosshairs"></i>
                Minha Localização

            </button>

        </div>

        <input class="search"
        id="pesquisa"
        placeholder="Pesquisar cliente..."
        onkeyup="listarClientes()">

        <div id="lista"></div>

    </div>

    <div id="map"></div>

</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<script>

const map = L.map('map').setView([-25.11,-53.84],13);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}).addTo(map);

let clientes =
JSON.parse(localStorage.getItem("clientes")) || [];

let markers = [];
let minhaPosicao = null;
let controleRota = null;

function toast(msg,color="#22c55e"){

    const t=document.getElementById("toast");

    t.innerHTML=msg;
    t.style.background=color;

    t.classList.add("show");

    setTimeout(()=>{
        t.classList.remove("show");
    },3000);
}

function salvar(){
    localStorage.setItem(
        "clientes",
        JSON.stringify(clientes)
    );
}

function atualizarStats(){

    document.getElementById("totalClientes")
    .innerHTML=clientes.length;

    document.getElementById("gpsStatus")
    .innerHTML=minhaPosicao ? "ON" : "OFF";
}

function criarMarker(cliente,index){

    const marker=L.marker([
        cliente.latitude,
        cliente.longitude
    ])
    .addTo(map)
    .bindPopup(`
        <b>${cliente.nome}</b><br>
        ${cliente.referencia}<br><br>

        <button onclick="navegarCliente(${index})"
        style="background:#22c55e;color:white;padding:8px;border:none;border-radius:8px;cursor:pointer;">
        Navegar
        </button>
    `);

    markers.push(marker);
}

function listarClientes(){

    const busca=document.getElementById("pesquisa")
    .value.toLowerCase();

    const lista=document.getElementById("lista");

    lista.innerHTML="";

    clientes
    .filter(c=>
        c.nome.toLowerCase().includes(busca) ||
        c.referencia.toLowerCase().includes(busca)
    )
    .forEach((c,index)=>{

        lista.innerHTML+=`

        <div class="cliente">

            <h3>${c.nome}</h3>

            <p>${c.referencia}</p>

            <small>
            LAT: ${c.latitude}<br>
            LON: ${c.longitude}
            </small>

            <div class="actions">

                <button class="btn-green"
                onclick="navegarCliente(${index})">

                <i class="fa-solid fa-route"></i>

                </button>

                <button class="btn-blue"
                onclick="focarCliente(${index})">

                <i class="fa-solid fa-map-location-dot"></i>

                </button>

                <button class="btn-red"
                onclick="excluirCliente(${index})">

                <i class="fa-solid fa-trash"></i>

                </button>

            </div>

        </div>

        `;
    });

    atualizarStats();
}

function adicionarCliente(){

    const nome=document.getElementById("nome").value;
    const ref=document.getElementById("ref").value;
    const lat=parseFloat(document.getElementById("lat").value);
    const lon=parseFloat(document.getElementById("lon").value);

    if(!nome || !ref || isNaN(lat) || isNaN(lon)){
        toast("Preencha todos os campos!","#ef4444");
        return;
    }

    const cliente={
        nome,
        referencia:ref,
        latitude:lat,
        longitude:lon
    };

    clientes.push(cliente);

    salvar();
    atualizarMapa();

    document.getElementById("nome").value="";
    document.getElementById("ref").value="";
    document.getElementById("lat").value="";
    document.getElementById("lon").value="";

    toast("Cliente adicionado!");
}

function excluirCliente(index){

    if(confirm("Deseja excluir este cliente?")){

        clientes.splice(index,1);

        salvar();
        atualizarMapa();

        toast("Cliente removido!","#ef4444");
    }
}

function focarCliente(index){

    const c=clientes[index];

    map.setView([c.latitude,c.longitude],16);
}

function minhaLocalizacao(){

    if(!navigator.geolocation){
        toast("GPS não suportado","#ef4444");
        return;
    }

    navigator.geolocation.getCurrentPosition(pos=>{

        const lat=pos.coords.latitude;
        const lon=pos.coords.longitude;

        minhaPosicao=L.latLng(lat,lon);

        L.marker([lat,lon])
        .addTo(map)
        .bindPopup("📍 Você está aqui")
        .openPopup();

        map.setView([lat,lon],16);

        atualizarStats();

        toast("Localização ativada!");

    },()=>{

        toast("Erro ao obter localização","#ef4444");

    });
}

function navegarCliente(index){

    if(!minhaPosicao){

        toast("Ative sua localização primeiro!","#ef4444");
        return;
    }

    const c=clientes[index];

    if(controleRota){
        map.removeControl(controleRota);
    }

    controleRota=L.Routing.control({

        waypoints:[
            minhaPosicao,
            L.latLng(c.latitude,c.longitude)
        ],

        routeWhileDragging:false,
        addWaypoints:false,
        draggableWaypoints:false,
        showAlternatives:true,

        lineOptions:{
            styles:[
                {
                    color:'#22c55e',
                    opacity:0.9,
                    weight:6
                }
            ]
        },

        createMarker:()=>null

    }).addTo(map);

    toast(`Navegando até ${c.nome}`);
}

function atualizarMapa(){

    markers.forEach(m=>map.removeLayer(m));

    markers=[];

    clientes.forEach((c,index)=>{
        criarMarker(c,index);
    });

    listarClientes();
}

function atualizarHora(){

    const agora=new Date();

    document.getElementById("hora")
    .innerHTML=agora.toLocaleTimeString("pt-BR");
}

setInterval(atualizarHora,1000);

atualizarHora();
atualizarMapa();

</script>

</body>
</html>
